<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Map of the ecosystem: TRACE in front as the memory, ANIMA and Reflex behind it. Each pin links to its repo and demo.">
  <title>My map: TRACE at the front, ANIMA and Reflex behind it</title>
  <g font-family="system-ui, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="320" y="28" font-size="15" font-weight="600" letter-spacing="2" fill="#667085">ONE ECOSYSTEM</text>
    <!-- behind: ANIMA (left) and Reflex (right) -->
    <rect x="30" y="50" width="250" height="110" rx="12" fill="#eef1f7" stroke="#8a93ad" stroke-width="2"/>
    <text x="155" y="100" font-size="26" font-weight="700" fill="#1a2333">ANIMA</text>
    <text x="155" y="128" font-size="14" fill="#445066">coding agents that remember</text>
    <a href="https://anshul48.github.io/anima-substrate/demo/">
      <title>ANIMA demo: check the record in your browser</title>
      <text x="155" y="184" font-size="14" font-weight="600" fill="#1f3a8a" text-decoration="underline">watch the demo</text>
    </a>
    <rect x="360" y="50" width="250" height="110" rx="12" fill="#eef1f7" stroke="#8a93ad" stroke-width="2"/>
    <text x="485" y="100" font-size="26" font-weight="700" fill="#1a2333">Reflex</text>
    <text x="485" y="128" font-size="14" fill="#445066">an AI that finds the right button</text>
    <a href="https://anshul48.github.io/demo-trace-anima-reflex/">
      <title>Reflex demo: static replay, no login</title>
      <text x="485" y="184" font-size="14" font-weight="600" fill="#1f3a8a" text-decoration="underline">watch the demo</text>
    </a>
    <!-- connecting lines, drawn before the front box so TRACE covers them -->
    <line x1="155" y1="160" x2="260" y2="250" stroke="#8a93ad" stroke-width="2"/>
    <line x1="485" y1="160" x2="380" y2="250" stroke="#8a93ad" stroke-width="2"/>
    <!-- front: TRACE overlaps the lines -->
    <rect x="155" y="250" width="330" height="130" rx="14" fill="#dce8ff" stroke="#1f3a8a" stroke-width="3"/>
    <text x="320" y="302" font-size="34" font-weight="800" fill="#12245e">TRACE</text>
    <text x="320" y="332" font-size="15" font-weight="600" fill="#1f3a8a">the memory, at the front</text>
    <a href="https://anshul48.github.io/trace/explorer/">
      <title>TRACE demo: the explorer replay</title>
      <text x="320" y="404" font-size="14" font-weight="600" fill="#1f3a8a" text-decoration="underline">watch the demo</text>
    </a>
    <!-- pins: each pin links to its repo -->
    <a href="https://github.com/Anshul48/anima-substrate">
      <title>ANIMA repo</title>
      <g transform="translate(272,72)">
        <path d="M0,0 C-9,-12 -13,-16 -13,-22 A13,13 0 1,1 13,-22 C13,-16 9,-12 0,0 Z" fill="#c81e1e"/>
        <circle cx="0" cy="-22" r="4.5" fill="#ffffff"/>
      </g>
    </a>
    <a href="https://github.com/Anshul48/demo-trace-anima-reflex">
      <title>Reflex demo repo</title>
      <g transform="translate(602,72)">
        <path d="M0,0 C-9,-12 -13,-16 -13,-22 A13,13 0 1,1 13,-22 C13,-16 9,-12 0,0 Z" fill="#c81e1e"/>
        <circle cx="0" cy="-22" r="4.5" fill="#ffffff"/>
      </g>
    </a>
    <a href="https://github.com/Anshul48/trace">
      <title>TRACE repo</title>
      <g transform="translate(477,272)">
        <path d="M0,0 C-10,-13 -14,-18 -14,-24 A14,14 0 1,1 14,-24 C14,-18 10,-13 0,0 Z" fill="#c81e1e"/>
        <circle cx="0" cy="-24" r="5" fill="#ffffff"/>
      </g>
    </a>
  </g>
</svg>
