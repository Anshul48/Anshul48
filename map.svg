<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-label="Map of the ecosystem: TRACE largest as the memory, ANIMA and Reflex adjacent. ANIMA connects to TRACE as a prototype; Reflex stands alone.">
  <title>Anshul Raj's map: TRACE at the vanguard, ANIMA and Reflex beside it</title>
  <style>
    .trace-card { fill: #dce8ff; stroke: #1f3a8a; }
    .side-card { fill: #eef1f7; stroke: #8a93ad; }
    .trace-name { fill: #12245e; }
    .side-name { fill: #1a2333; }
    .muted { fill: #445066; }
    .caption { fill: #667085; }
    .link { fill: #1f3a8a; }
    .wire { stroke: #8a93ad; }
    .wire-label { fill: #445066; }
    @media (prefers-color-scheme: dark) {
      .trace-card { fill: #172a5e; stroke: #8fb0ff; }
      .side-card { fill: #1a2233; stroke: #6b7590; }
      .trace-name { fill: #dbe6ff; }
      .side-name { fill: #e8edf7; }
      .muted { fill: #a9b4cc; }
      .caption { fill: #9aa4bd; }
      .link { fill: #a9c2ff; }
      .wire { stroke: #8b95b3; }
      .wire-label { fill: #a9b4cc; }
    }
  </style>
  <g font-family="system-ui, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="320" y="28" font-size="15" font-weight="600" letter-spacing="2" class="caption">ONE ECOSYSTEM</text>
    <!-- TRACE: largest card -->
    <rect x="110" y="48" width="420" height="190" rx="14" class="trace-card" stroke-width="3"/>
    <text x="320" y="118" font-size="42" font-weight="800" class="trace-name">TRACE</text>
    <text x="320" y="150" font-size="15" font-weight="600" class="muted">the memory, at the vanguard</text>
    <text x="320" y="172" font-size="13" class="muted">a 100M library that organizes itself</text>
    <a href="https://github.com/Anshul48/trace">
      <title>TRACE repository</title>
      <text x="285" y="210" font-size="14" font-weight="600" class="link" text-decoration="underline">repository</text>
    </a>
    <text x="320" y="210" font-size="14" class="muted">·</text>
    <a href="https://anshul48.github.io/trace/explorer/">
      <title>TRACE explorer: replay of real recorded searches</title>
      <text x="358" y="210" font-size="14" font-weight="600" class="link" text-decoration="underline">explorer</text>
    </a>
    <!-- ANIMA (left) and Reflex (right), adjacent -->
    <rect x="30" y="262" width="275" height="170" rx="12" class="side-card" stroke-width="2"/>
    <text x="167" y="308" font-size="28" font-weight="700" class="side-name">ANIMA</text>
    <text x="167" y="334" font-size="13" class="muted">memory for coding work</text>
    <a href="https://github.com/Anshul48/anima-substrate">
      <title>ANIMA repository</title>
      <text x="122" y="402" font-size="13" font-weight="600" class="link" text-decoration="underline">repository</text>
    </a>
    <text x="167" y="402" font-size="13" class="muted">·</text>
    <a href="https://anshul48.github.io/anima-substrate/demo/">
      <title>ANIMA recorded demo</title>
      <text x="220" y="402" font-size="13" font-weight="600" class="link" text-decoration="underline">recorded demo</text>
    </a>
    <rect x="335" y="262" width="275" height="170" rx="12" class="side-card" stroke-width="2"/>
    <text x="472" y="308" font-size="28" font-weight="700" class="side-name">Reflex</text>
    <text x="472" y="334" font-size="13" class="muted">the right button, first try</text>
    <a href="https://github.com/Anshul48/demo-trace-anima-reflex">
      <title>Reflex demo repository</title>
      <text x="415" y="402" font-size="13" font-weight="600" class="link" text-decoration="underline">demo repository</text>
    </a>
    <text x="472" y="402" font-size="13" class="muted">·</text>
    <a href="https://anshul48.github.io/demo-trace-anima-reflex/">
      <title>Reflex replay</title>
      <text x="512" y="402" font-size="13" font-weight="600" class="link" text-decoration="underline">replay</text>
    </a>
    <!-- ANIMA prototype connection to TRACE; Reflex has no TRACE line -->
    <line x1="180" y1="262" x2="180" y2="238" class="wire" stroke-width="2"/>
    <text x="242" y="255" font-size="13" font-style="italic" class="wire-label">prototype</text>
  </g>
</svg>
